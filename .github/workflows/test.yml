name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scheduling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: functions
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        working-directory: functions
        run: python -m unittest discover
